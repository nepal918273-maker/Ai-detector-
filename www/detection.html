<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/app-icon.svg">
  <script src="js/pwa.js"></script>
  <title>AI Detection Result</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; max-width: 100%; margin: 0; overflow: hidden;
    }
    body {
      background:
        radial-gradient(circle at 15% 0%, rgba(160, 208, 255, 0.85), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(255,255,255,0.82), transparent 20%),
        linear-gradient(135deg, #edf7ff 0%, #dfeeff 32%, #f4f8ff 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      padding: 20px;
      color: #1e1e1e;
    }
    .cards-wrapper {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .container {
      background: rgba(255,255,255,0.3);
      border: 1px solid rgba(255,255,255,0.75);
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 24px 60px rgba(22,65,130,0.12), inset 0 1px 0 rgba(255,255,255,0.6);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .photo-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 350px;
      border: 2px dashed #d0d0d0;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f9f9f9;
      position: relative;
      overflow: hidden;
    }
    #previewImage, #aiMessage { display: none; }
    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
    }
    .photo-box .placeholder {
      text-align: center;
      color: #888;
      font-size: 0.95rem;
      z-index: 1;
      padding: 10px;
      word-break: break-word;
    }
    .input-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
    }
    input[type="text"], textarea {
      width: 100%;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px 14px;
      color: #1e1e1e;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      min-height: 60px;
      outline: none;
    }
    .field { display: flex; flex-direction: column; }
    .button-row { width: 100%; display: flex; gap: 12px; margin-top: 8px; }
    .btn {
      flex: 1;
      border: 1px solid rgba(255,255,255,0.7);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      padding: 12px 0;
      border-radius: 14px;
      cursor: pointer;
      background: linear-gradient(135deg, #60a5fa 0%, #2563eb 50%, #0ea5e9 100%);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: 0 12px 22px rgba(37,99,235,0.18), inset 0 1px 0 rgba(255,255,255,0.5);
      position: relative; overflow: hidden;
    }
    .btn:hover { filter: brightness(1.04); transform: translateY(-1px); }
    .btn:active {
      transform: scale(0.98);
      box-shadow: 0 0 0 4px rgba(96,165,250,0.22), 0 0 22px rgba(59,130,246,0.7), 0 10px 20px rgba(37,99,235,0.25);
    }
    .btn-cancel {
      background: rgba(255,255,255,0.42);
      color: #234b76;
    }
    .btn-cancel:hover { background: rgba(255,255,255,0.64); }
    .btn-save {
      background: linear-gradient(135deg, #60a5fa 0%, #2563eb 50%, #0ea5e9 100%);
    }
    .btn-execute {
      background: linear-gradient(135deg, #60a5fa 0%, #2563eb 50%, #0ea5e9 100%);
      width: 100%;
      margin-top: 8px;
    }
    .hint { font-size: 0.75rem; color: #999; margin-top: 4px; }
    .status-message {
      font-weight: 600;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
    }
    .ai { background: #fee2e2; color: #b91c1c; }
    .human { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>
  <script src="js/auth-guard.js"></script>
  <div class="cards-wrapper" id="cardsWrapper">
    <!-- Result Card -->
    <div class="container card" id="resultCard">
      <!-- Content/Photo box -->
      <div class="photo-box" id="contentBox">
        <div class="placeholder" id="placeholderContent">Detection result will appear here</div>
        <img id="previewImage" alt="Preview">
      </div>

      <!-- Location -->
      <div class="input-group">
        <div class="field">
          <label>🔎 Details Found</label>
          <textarea id="detailsField" rows="3" readonly placeholder="What the AI found will appear here"></textarea>
        </div>

        <!-- AI Message -->
        <div class="field">
          <label>🤖 AI Status</label>
          <div id="aiMessage" class="status-message"></div>
        </div>

        <!-- Prompt (with Execute inside) -->
        <div class="field">
          <label>💬 Prompt to Recreate</label>
          <textarea id="promptField" rows="3" placeholder="If AI-built, the prompt used"></textarea>
          <button class="btn btn-execute" id="executeBtn" onclick="executePrompt()">Execute</button>
        </div>

        <!-- Save & Cancel Buttons -->
        <div class="button-row">
          <button class="btn btn-cancel" id="cancelBtn" onclick="goBack()">Cancel</button>
          <button class="btn btn-save" id="saveBtn" onclick="saveResult()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.protocol === 'file:' ? 'http://127.0.0.1:8000' : window.location.origin;
    // Extract query parameters passed from index.html
    const params = new URLSearchParams(window.location.search);
    const type = params.get('type');
    let data = params.get('data') || '';
    let savedPhoto = null;
    try { savedPhoto = JSON.parse(localStorage.getItem('ai_detect_photo') || 'null'); } catch { localStorage.removeItem('ai_detect_photo'); }
    if (type === 'photo' && savedPhoto) data = savedPhoto.data;

    // Store current result for saving
    let currentResult = null;

    async function fetchDetectionResult() {
      try {
        if (!['text', 'url', 'file', 'photo'].includes(type)) throw new Error('Unsupported detection type');
        if (type !== 'photo' && !data.trim()) throw new Error('No input was provided');
        const formData = new FormData();
        formData.append('mode', type);
        if (type === 'photo') {
          const blob = dataURLtoBlob(data);
          formData.append('file', blob, 'photo.png');
        } else {
          formData.append('content', data);
        }

        const response = await fetch(`${API_BASE}/detect`, {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${localStorage.getItem('authToken') || ''}`
          },
          body: formData
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || result.error || `Server error: ${response.status}`);

        currentResult = result; // store for later
        displayResult(result);
      } catch (err) {
        document.getElementById('placeholderContent').textContent = 'Error: ' + err.message;
      }
    }

    function dataURLtoBlob(dataURL) {
      const arr = dataURL.split(',');
      const match = arr[0].match(/:(.*?);/);
      if (!match || !arr[1]) throw new Error('Invalid image data');
      const mime = match[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while(n--) u8arr[n] = bstr.charCodeAt(n);
      return new Blob([u8arr], {type: mime});
    }

    function displayResult(result) {
      const previewImg = document.getElementById('previewImage');
      const placeholder = document.getElementById('placeholderContent');

      if (result.content_type === 'photo') {
        previewImg.style.display = 'block';
        previewImg.src = URL.createObjectURL(dataURLtoBlob(data));
        placeholder.style.display = 'none';
      } else {
        placeholder.textContent = result.original_content || 'No content';
        previewImg.style.display = 'none';
      }

      document.getElementById('detailsField').value = (result.details || []).join('\n') || result.ai_message || 'No specific details returned.';

      const aiMsg = document.getElementById('aiMessage');
      aiMsg.textContent = result.ai_message || 'No AI determination';
      aiMsg.className = 'status-message ' + (result.is_ai_built ? 'ai' : 'human');
      aiMsg.style.display = 'block';

      document.getElementById('promptField').value = result.prompt || '';

      window.executeUrl = result.execute_url || '';
    }

    function saveResult() {
      if (!currentResult) {
        alert('No detection result to save yet.');
        return;
      }

      const entry = {
        type: currentResult.content_type || type,
        score: currentResult.score || 0,
        is_ai: currentResult.is_ai_built || false,
        message: currentResult.ai_message || '',
        details: currentResult.details || [],
        prompt: currentResult.prompt || '',
        timestamp: new Date().toLocaleString()
      };

      // Add photo or content preview
      if (type === 'photo') {
        entry.photo = data; // base64
      } else {
        entry.contentPreview = currentResult.original_content ? currentResult.original_content.substring(0, 200) : (data || '').substring(0, 200);
      }

      let history = [];
      try { history = JSON.parse(localStorage.getItem('scanHistory') || '[]'); } catch { localStorage.removeItem('scanHistory'); }
      if (!Array.isArray(history)) history = [];
      history.unshift(entry);
      localStorage.setItem('scanHistory', JSON.stringify(history));

      alert('Result saved to history.');
    }

    function executePrompt() {
      const promptText = document.getElementById('promptField').value.trim();
      if (promptText) {
        // Save the prompt to localStorage so the chatbot can pick it up
        localStorage.setItem('chatPrompt', promptText);
        // Navigate to the chatbot page
        window.location.href = 'chat.html';
      } else {
        alert('No prompt to execute.');
      }
    }

    function goBack() {
      window.location.href = 'index.html';
    }

    // Run on load
    fetchDetectionResult();
  </script>
</body>
</html>
