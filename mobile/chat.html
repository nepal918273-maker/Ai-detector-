<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/app-icon.svg">
  <script src="js/pwa.js"></script>
  <title>Detection Chatbot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      background:
        radial-gradient(circle at 12% 0%, rgba(96, 165, 250, 0.96), transparent 26%),
        radial-gradient(circle at 92% 20%, rgba(255,255,255,0.96), transparent 18%),
        linear-gradient(135deg, #eaf5ff 0%, #dceeff 26%, #cfe3ff 70%, #ebf7ff 100%);
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 0;
      color: #172033;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.28);
      border-bottom: 1px solid rgba(255,255,255,0.75);
      box-shadow: 0 18px 40px rgba(23,32,51,0.06), inset 0 1px 0 rgba(255,255,255,0.5);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }
    .logo-container { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
    .header-icons { display: flex; align-items: center; gap: 14px; }
    .icon-btn { width: 36px; height: 36px; border: 1px solid rgba(255,255,255,0.54); background: rgba(255,255,255,0.18); border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #172033; box-shadow: 0 8px 20px rgba(37,99,235,0.08); transition: all 0.2s ease; }
    .icon-btn:hover { background: rgba(255,255,255,0.34); transform: translateY(-1px); }
    .icon-btn:active { box-shadow: 0 0 0 3px rgba(96,165,250,0.18), 0 0 20px rgba(59,130,246,0.35); transform: scale(0.97); }
    .icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }

    .chat-container {
      width: 100%;
      max-width: 700px;
      height: calc(100vh - 140px);
      background: rgba(255,255,255,0.36);
      box-shadow: 0 24px 60px rgba(22,65,130,0.18), inset 0 1px 0 rgba(255,255,255,0.76);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.82);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      margin: 16px auto 18px;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }

    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid #eaeaea;
      background: #ffffff;
    }

    .chat-header-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #333;
    }

    .messages-container {
      flex: 1;
      padding: 20px 20px 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 80%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.ai {
      align-self: flex-start;
    }

    .message-bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.55);
      box-shadow: 0 12px 24px rgba(37,99,235,0.08);
    }
    #fileInput { display: none; }

    .user .message-bubble {
      background: #6c63ff;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .ai .message-bubble {
      background: #f1f3f5;
      color: #333;
      border-bottom-left-radius: 4px;
    }

    .typing-indicator {
      display: flex;
      gap: 6px;
      padding: 12px 16px;
      align-self: flex-start;
      background: #f1f3f5;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: #999;
      border-radius: 50%;
      animation: typingBounce 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }

    .input-area {
      padding: 16px 20px;
      border-top: 1px solid #eaeaea;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
    }

    .media-actions { display: flex; gap: 6px; padding: 10px 20px 0; background: #fff; }
    .media-action { border: 1px solid rgba(255,255,255,0.7); background: rgba(255,255,255,0.24); border-radius: 10px; padding: 7px 10px; cursor: pointer; font-size: .78rem; color: #234b76; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4); transition: all 0.2s ease; }
    .media-action:hover { border-color: rgba(59,130,246,0.7); color: #1d4ed8; background: rgba(255,255,255,0.48); }
    .media-action:active { transform: scale(0.97); box-shadow: 0 0 0 3px rgba(96,165,250,0.18), 0 0 20px rgba(59,130,246,0.28); }
    .media-preview { max-width: 100%; border-radius: 10px; display: block; }
    .media-video { max-width: 100%; border-radius: 10px; display: block; }

    .icon-btn {
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.5);
      color: #777;
      cursor: pointer;
      padding: 0;
      border-radius: 10px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      box-shadow: 0 8px 18px rgba(37,99,235,0.08);
    }

    .icon-btn:hover {
      background: rgba(255,255,255,0.34);
      color: #333;
    }

    .icon-btn:active {
      transform: scale(0.97);
      box-shadow: 0 0 0 3px rgba(96,165,250,0.18), 0 0 20px rgba(59,130,246,0.25);
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .voice-active {
      color: #ff5252 !important;
      box-shadow: 0 0 0 3px rgba(255,82,82,0.12), 0 0 20px rgba(255,82,82,0.24);
    }

    .send-btn {
      color: #000;
      background: linear-gradient(135deg, #dfeeff 0%, #cfe3ff 100%);
    }

    .send-btn:hover {
      background: linear-gradient(135deg, #dfeeff 0%, #bfe0ff 100%);
    }

    .send-btn:active {
      box-shadow: 0 0 0 3px rgba(96,165,250,0.18), 0 0 20px rgba(59,130,246,0.38);
      transform: scale(0.97);
    }

    .send-btn svg {
      width: 22px;
      height: 22px;
      stroke: #000;
      stroke-width: 2.5;
    }

    .message-input {
      flex: 1;
      background: rgba(255,255,255,0.36);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 24px;
      padding: 12px 18px;
      color: #333;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .message-input:focus {
      border-color: rgba(37,99,235,0.75);
      background: rgba(255,255,255,0.62);
      box-shadow: 0 0 0 4px rgba(96,165,250,0.12);
    }

    .bottom-nav {
      position: sticky;
      bottom: 0;
      z-index: 50;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(255,255,255,0.28);
      border-top: 1px solid rgba(255,255,255,0.7);
      padding: 10px 0 18px;
      box-shadow: 0 -18px 30px rgba(37,99,235,0.08);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.5); border-radius: 14px; cursor: pointer; color: #6b7280; font-size: 0.7rem; font-weight: 500; text-decoration: none; padding: 6px 8px; transition: all 0.2s ease; }
    .nav-item:hover { color: #2563EB; background: rgba(255,255,255,0.28); transform: translateY(-1px); }
    .nav-item:active { transform: scale(0.97); box-shadow: 0 0 0 3px rgba(96,165,250,0.12), 0 0 20px rgba(59,130,246,0.25); }
    .nav-item.active { color: #2563EB; }
    .nav-item svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item .check-circle { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #60a5fa, #2563eb); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(37,99,235,0.28); color: white; }
    .nav-item .check-circle svg { width: 24px; height: 24px; stroke: white; fill: none; }

    @media (max-width: 500px) {
      .message {
        max-width: 90%;
      }
      .chat-container {
        height: calc(100vh - 130px);
        margin: 0;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <script src="js/auth-guard.js"></script>
  <header class="app-header">
    <div class="logo-container">
      <svg viewBox="0 0 200 200" width="40" height="40">
        <defs><linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient></defs>
        <circle cx="100" cy="100" r="80" fill="#F0F9FF" stroke="url(#logoGrad)" stroke-width="6"/>
        <text x="100" y="130" font-family="Arial" font-size="90" font-weight="700" fill="url(#logoGrad)" text-anchor="middle" letter-spacing="-8">AI</text>
        <path d="M 30 100 A 70 70 0 0 1 100 30" fill="none" stroke="url(#logoGrad)" stroke-width="6" stroke-linecap="round"/>
        <circle cx="30" cy="100" r="4" fill="#2563EB"/>
      </svg>
    </div>
    <div class="header-icons">
      <a href="login.html" class="icon-btn" aria-label="Profile"><svg viewBox="0 0 28 28"><circle cx="14" cy="9" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5,25 C5,18 9,15 14,15 C19,15 23,18 23,25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></a>
      <button class="icon-btn" aria-label="Notifications" type="button"><svg viewBox="0 0 28 28"><path d="M8,10 C8,6 11,3 14,3 C17,3 20,6 20,10 L21,14 L21,16 C21,17 20,18 20,19 L8,19 C8,18 7,17 7,16 L7,14 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10,20 A4,4 0 0,0 18,20" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="14" cy="20" r="1.5" fill="currentColor"/></svg></button>
    </div>
  </header>
  <div class="chat-container">
    <div class="chat-header">
      <div class="chat-header-title">Detection Chatbot</div>
    </div>

    <div class="messages-container" id="messagesContainer"></div>

    <div class="media-actions">
      <button class="media-action" id="imageBtn" type="button">Create image</button>
      <button class="media-action" id="videoBtn" type="button">Create 3 min video</button>
      <button class="media-action" id="recordBtn" type="button">Record voice</button>
    </div>

    <div class="input-area">
      <button class="icon-btn" id="attachBtn" title="Attach file">
        <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.txt,.csv,.json">

      <button class="icon-btn" id="voiceBtn" title="Voice input">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>

      <input type="text" class="message-input" id="messageInput" placeholder="Type a message..." autofocus>

      <button class="icon-btn send-btn" id="sendBtn" title="Send message">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item" type="button" onclick="navigate('index.html')"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="9 22 9 12 15 12 15 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Home</span></button>
    <button class="nav-item" type="button" onclick="navigate('history.html')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="12 6 12 12 16 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>History</span></button>
    <button class="nav-item" type="button" onclick="navigate('about.html')"><span class="check-circle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="white" stroke-width="2"/><line x1="12" y1="11" x2="12" y2="17" stroke="white" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7" r="1" fill="white" stroke="none"/></svg></span><span>About</span></button>
    <button class="nav-item" type="button" onclick="navigate('free.html')"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Free AI</span></button>
    <button class="nav-item active" type="button" onclick="navigate('chat.html')"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="10" r="1" fill="currentColor" stroke="none"/></svg><span>AI Chat</span></button>
  </nav>
  <script>
    function navigate(page) { window.location.href = page; }
    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');
    const voiceBtn = document.getElementById('voiceBtn');
    const imageBtn = document.getElementById('imageBtn');
    const videoBtn = document.getElementById('videoBtn');
    const recordBtn = document.getElementById('recordBtn');
    const API_BASE = window.location.protocol === 'file:' ? 'http://127.0.0.1:8000' : window.location.origin;
    const authHeaders = () => ({ Authorization: `Bearer ${localStorage.getItem('authToken') || ''}` });

    // ----- Helper functions -----
    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = text;
      msgDiv.appendChild(bubble);
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function addMediaMessage(url, type, sender = 'ai') {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      const media = document.createElement(type === 'video' ? 'video' : 'img');
      media.className = type === 'video' ? 'media-video' : 'media-preview';
      media.src = url;
      media.controls = type === 'video';
      media.alt = type === 'video' ? 'Generated video' : 'Generated image';
      bubble.appendChild(media);
      msgDiv.appendChild(bubble);
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function generateMedia(kind) {
      const prompt = messageInput.value.trim();
      if (!prompt) { addMessage('Enter a prompt first.', 'ai'); return; }
      addMessage(`${kind === 'video' ? '🎬' : '🖼️'} ${prompt}`, 'user');
      messageInput.value = '';
      const typingDiv = showTypingIndicator();
      try {
        const response = await fetch(`${API_BASE}/generate/${kind}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify({ prompt })
        });
        if (!response.ok) throw new Error((await response.json()).detail || `Server error: ${response.status}`);
        const mediaBlob = await response.blob();
        addMediaMessage(URL.createObjectURL(mediaBlob), mediaBlob.type.startsWith('video/') ? 'video' : 'image');
      } catch (err) { addMessage(`Media creation failed: ${err.message}`, 'ai'); }
      finally { hideTypingIndicator(typingDiv); }
    }

    function showTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'typing-indicator';
      typingDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      messagesContainer.appendChild(typingDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return typingDiv;
    }

    function hideTypingIndicator(typingDiv) {
      if (typingDiv && typingDiv.parentNode) typingDiv.parentNode.removeChild(typingDiv);
    }

    function dataURLtoBlob(dataURL) {
      const arr = dataURL.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while (n--) u8arr[n] = bstr.charCodeAt(n);
      return new Blob([u8arr], { type: mime });
    }

    function formatDetectionResult(data) {
      if (!data) return "No response from server.";
      if (data.error) return `Error: ${data.error}`;
      if (data.mode === 'photo') {
        return `📷 Photo Detection Result:\nScore: ${data.summary?.score ?? data.score ?? 'N/A'}%\n${data.summary?.message ?? data.message ?? ''}`;
      } else if (data.result) {
        return `🔍 AI Detection Result:\nScore: ${data.result.score}%\n${data.result.message}`;
      } else {
        return JSON.stringify(data, null, 2);
      }
    }

    // ----- Send text message -----
    async function sendTextMessage(forceText = null) {
      const text = (forceText ?? messageInput.value).trim();
      if (!text) return;
      addMessage(text, 'user');
      messageInput.value = '';
      const typingDiv = showTypingIndicator();
      try {
        const response = await fetch(`${API_BASE}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({ message: text })
        });
        if (!response.ok) throw new Error(`Server error: ${response.status}`);
        const data = await response.json();
        hideTypingIndicator(typingDiv);
        addMessage(data.reply || formatDetectionResult(data), 'ai');
      } catch (err) {
        hideTypingIndicator(typingDiv);
        addMessage(`⚠️ Server not reachable. Please start server.js and try again.\n(${err.message})`, 'ai');
      }
    }

    // ----- Attach file -----
    attachBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async () => {
      if (fileInput.files.length === 0) return;
      const file = fileInput.files[0];
      addMessage(`📎 ${file.name}`, 'user');
      const typingDiv = showTypingIndicator();
      try {
        const formData = new FormData();
        let mode = 'file';
        if (file.type.startsWith('image/')) {
          mode = 'photo';
        }
        formData.append('file', file, file.name);
        formData.append('mode', mode);
        const response = await fetch(`${API_BASE}/detect`, {
          method: 'POST',
          headers: authHeaders(),
          body: formData
        });
        if (!response.ok) throw new Error(`Server error: ${response.status}`);
        const data = await response.json();
        hideTypingIndicator(typingDiv);
        addMessage(formatDetectionResult(data), 'ai');
      } catch (err) {
        hideTypingIndicator(typingDiv);
        addMessage(`⚠️ Server not reachable. Please start server.js and try again.\n(${err.message})`, 'ai');
      }
      fileInput.value = '';
    });

    // ----- Voice input (Web Speech API) -----
    let recognition = null;
    let isRecording = false;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';
      recognition.onresult = (event) => {
        const transcript = Array.from(event.results)
          .map(result => result[0].transcript)
          .join(' ')
          .trim();

        if (!transcript) return;

        const isFinal = event.results[event.results.length - 1].isFinal;
        messageInput.value = transcript;
        messageInput.focus();

        if (isFinal) {
          sendTextMessage(transcript);
        }
      };
      recognition.onerror = (event) => {
        console.error('Speech recognition error', event.error);
        voiceBtn.classList.remove('voice-active');
        isRecording = false;
        addMessage(`⚠️ Voice input failed: ${event.error}`, 'ai');
      };
      recognition.onend = () => {
        voiceBtn.classList.remove('voice-active');
        isRecording = false;
      };
    }

    voiceBtn.addEventListener('click', () => {
      if (!recognition) {
        addMessage("⚠️ Voice recognition is not supported in this browser.", 'ai');
        return;
      }
      if (isRecording) {
        recognition.stop();
        isRecording = false;
        voiceBtn.classList.remove('voice-active');
      } else {
        recognition.start();
        isRecording = true;
        voiceBtn.classList.add('voice-active');
      }
    });

    imageBtn.addEventListener('click', () => generateMedia('image'));
    videoBtn.addEventListener('click', () => generateMedia('video'));

    let recorder = null;
    let recordingChunks = [];
    recordBtn.addEventListener('click', async () => {
      if (recorder?.state === 'recording') { recorder.stop(); return; }
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        addMessage('Voice recording is not supported in this browser.', 'ai'); return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordingChunks = [];
        recorder = new MediaRecorder(stream);
        recorder.ondataavailable = event => recordingChunks.push(event.data);
        recorder.onstop = async () => {
          stream.getTracks().forEach(track => track.stop());
          const blob = new Blob(recordingChunks, { type: recorder.mimeType || 'audio/webm' });
          const formData = new FormData();
          formData.append('file', blob, 'voice-recording.webm');
          try {
            const response = await fetch(`${API_BASE}/recordings`, { method: 'POST', headers: authHeaders(), body: formData });
            const result = await response.json();
            if (!response.ok) throw new Error(result.detail || result.error);
            addMessage(`🎙️ ${result.message}`, 'ai');
          } catch (err) { addMessage(`Recording upload failed: ${err.message}`, 'ai'); }
          recordBtn.textContent = 'Record voice';
        };
        recorder.start();
        recordBtn.textContent = 'Stop recording';
      } catch (err) { addMessage(`Microphone unavailable: ${err.message}`, 'ai'); }
    });

    // ----- Send button and Enter key -----
    sendBtn.addEventListener('click', sendTextMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendTextMessage();
    });

    // ----- Auto-fill prompt from detection.html -----
    const savedPrompt = localStorage.getItem('chatPrompt');
    if (savedPrompt) {
      messageInput.value = savedPrompt;
      messageInput.focus();
      localStorage.removeItem('chatPrompt'); // clear after use
    }
  </script>
</body>
</html>
